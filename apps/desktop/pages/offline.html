<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>DoTask — Sin conexión</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f9fafb; color: #111827; }
      main { max-width: 420px; padding: 40px 32px; background: #fff; border-radius: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); text-align: center; }
      h1 { font-size: 22px; margin: 0 0 12px; }
      p { color: #4b5563; line-height: 1.6; margin: 0 0 24px; }
      a { display: inline-block; padding: 10px 18px; border-radius: 8px; background: #2563eb; color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <h1>No hay conexión con DoTask</h1>
      <p>Revisa tu conexión a internet e inténtalo de nuevo.</p>
      <a id="retry" href="https://dotaskweb.app-sprint.com">Reintentar</a>
    </main>
    <script>
      const retry = new URLSearchParams(location.search).get('retry');
      if (retry && /^https:\/\//.test(retry)) document.getElementById('retry').href = retry;
    </script>
  </body>
</html>
