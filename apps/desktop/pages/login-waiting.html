<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>DoTask — Inicia sesión en tu navegador</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f9fafb; color: #111827; }
      main { max-width: 420px; padding: 40px 32px; background: #fff; border-radius: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); text-align: center; }
      h1 { font-size: 22px; margin: 0 0 12px; }
      p { color: #4b5563; line-height: 1.6; margin: 0 0 24px; }
      a { display: inline-block; margin: 4px; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; }
      .primary { background: #2563eb; color: #fff; }
      .secondary { color: #374151; }
    </style>
  </head>
  <body>
    <main>
      <h1>Continúa en tu navegador</h1>
      <p>Abrimos tu navegador para que entres con tu cuenta de Google. Cuando termines, DoTask se abrirá aquí automáticamente.</p>
      <a id="retry" class="primary" href="#">Abrir el navegador otra vez</a>
      <a id="cancel" class="secondary" href="#">Cancelar</a>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const login = params.get('login');
      const appUrl = params.get('app');
      if (login) document.getElementById('retry').href = login;
      if (appUrl) document.getElementById('cancel').href = appUrl + '/login';
    </script>
  </body>
</html>
