<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>DoTask — Inicia sesión en tu navegador</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #F6F8FC; color: #17233B; }
      main { max-width: 420px; padding: 40px 32px; background: #fff; border-radius: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); text-align: center; }
      h1 { font-size: 22px; margin: 0 0 12px; }
      p { color: #53627A; line-height: 1.6; margin: 0 0 24px; }
      a { display: inline-block; margin: 4px; padding: 10px 18px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 14px; }
      .primary { background: #2457E6; color: #fff; }
      .secondary { color: #17233B; }
    </style>
  </head>
  <body>
    <main>
      <svg width="56" height="56" viewBox="0 0 512 512" aria-hidden="true" style="margin-bottom:16px"><rect width="512" height="512" rx="116" fill="#2457E6"/><path d="M128 280 L218 368 L388 178" fill="none" stroke="#fff" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 84 Q176.12 129.88 222 146 Q176.12 162.12 160 208 Q143.88 162.12 98 146 Q143.88 129.88 160 84 Z" fill="#F9C84A" stroke="#F9C84A" stroke-width="16" stroke-linejoin="round"/></svg>
      <h1>Continúa en tu navegador</h1>
      <p>Abrimos tu navegador para que entres con tu cuenta de Google. Cuando termines, DoTask se abrirá aquí automáticamente.</p>
      <a id="retry" class="primary" href="#">Abrir el navegador otra vez</a>
      <a id="cancel" class="secondary" href="#">Cancelar</a>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const login = params.get('login');
      const appUrl = params.get('app');
      if (login) document.getElementById('retry').href = login;
      if (appUrl) document.getElementById('cancel').href = appUrl + '/login';
    </script>
  </body>
</html>
