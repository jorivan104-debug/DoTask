services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dotask
      # Solo se aplica al crear el volumen por primera vez; cambiarlo después no
      # cambia la contraseña de una base existente.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dotask}
      POSTGRES_DB: dotask
    # Sin `ports`: la base solo es accesible desde la red interna del compose.
    # Para desarrollo local usa docker-compose.dev.yml.
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.api.rule=Host(`api.app-sprint.com`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://dotask:${POSTGRES_PASSWORD:-dotask}@postgres:5432/dotask?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      # Inicio de sesión con Google (Google Cloud Console → Credenciales → ID de cliente OAuth).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://api.app-sprint.com/v1/auth/callback}
      # Firma de la cookie de sesión, obligatoria (48+ caracteres aleatorios).
      SESSION_SECRET: ${SESSION_SECRET}

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.app-sprint.com}
    expose:
      - "80"
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.docker.network=dokploy-network"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:

networks:
  dokploy-network:
    external: true
