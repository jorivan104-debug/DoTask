plugins {
    id 'com.android.application'
}

// App Android de DoTask: Trusted Web Activity (TWA) que abre la web en Chrome a
// pantalla completa. El login con Google funciona porque corre dentro de Chrome.
def twaHost = 'dotaskweb.app-sprint.com'

// Firma: la clave NO está en el repositorio. CI la decodifica desde los secretos
// ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD (ver .github/workflows/release-apps.yml).
def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')

android {
    namespace 'com.appsprint.dotask'
    compileSdk 35

    defaultConfig {
        applicationId 'com.appsprint.dotask'
        minSdk 21
        targetSdk 35
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName(System.getenv('VERSION_NAME') ?: '1.0.0')

        manifestPlaceholders = [
            hostName  : twaHost,
            defaultUrl: "https://${twaHost}/",
        ]
        resValue 'string', 'app_name', 'DoTask'
        resValue 'string', 'asset_statements',
            "[{\\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], " +
            "\\\"target\\\": {\\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://${twaHost}\\\"}}]"
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'dotask'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: keystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        resValues true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
