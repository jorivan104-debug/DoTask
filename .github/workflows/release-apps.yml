# Compila DoTask para Windows (instalador NSIS) y Android (APK firmado) y los
# publica en un GitHub Release. La página de inicio enlaza a
#   https://github.com/jorivan104-debug/DoTask/releases/latest/download/DoTask-Setup.exe
#   https://github.com/jorivan104-debug/DoTask/releases/latest/download/DoTask.apk
#
# Se lanza al subir una etiqueta `apps-vX.Y.Z` o a mano desde la pestaña Actions.
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   clave de firma .jks en base64
#   ANDROID_KEYSTORE_PASSWORD contraseña de la clave
name: Release apps

on:
  push:
    tags: ['apps-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (por ejemplo 1.0.1)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || format('apps-v{0}', inputs.version) }}

jobs:
  windows:
    name: Windows (Electron)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Fijar versión
        shell: bash
        run: npm version "${VERSION#apps-v}" --no-git-tag-version --allow-same-version
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: apps/desktop/dist/DoTask-Setup.exe
          if-no-files-found: error

  android:
    name: Android (TWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar clave de firma
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sin secreto ANDROID_KEYSTORE_BASE64: se omite el APK y se publica solo Windows."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dotask-release.jks"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Compilar APK firmado
        if: steps.key.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dotask-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${VERSION#apps-v}"
          gradle -p apps/android assembleRelease --no-daemon
          cp apps/android/app/build/outputs/apk/release/app-release.apk DoTask.apk
      - name: Verificar firma
        if: steps.key.outputs.ready == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs DoTask.apk | grep -i "SHA-256"
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ready == 'true'
        with:
          name: android
          path: DoTask.apk
          if-no-files-found: error

  release:
    name: Publicar release
    needs: [windows, android]
    # Publica aunque falte el APK (secretos de firma aún sin configurar).
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: DoTask ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Instaladores de DoTask.

            - **Windows**: `DoTask-Setup.exe`. Windows SmartScreen puede avisar porque el instalador aún no está firmado: «Más información» → «Ejecutar de todas formas».
            - **Android**: `DoTask.apk`. Permite «Instalar apps desconocidas» para tu navegador la primera vez.
          files: |
            artifacts/DoTask-Setup.exe
            artifacts/DoTask.apk
          fail_on_unmatched_files: false
